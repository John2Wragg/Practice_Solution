[project]
name = "hastings-solution"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "pandera>=0.35.0",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "polars>=2.1.0",
    "plotly>=7.1.0",
    "ipykernel>=7.4.0",
    "fastexcel>=0.21.0",
    "nbformat>=5.11.1",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["functions", "params", "Data_Preparation", "Model_Building", "Model_Evaluation"]
